<script>

{nm:"SPDR EU Small Cap Value ETF",tk:"ZPRX.DE",isin:"IE00BSPLC298",qty:51,cur:"EUR",avg:60.95,sec:"Sm-Cap Value",geo:"Europe"},

{nm:"Theon International PLC",tk:"THEON.AS",isin:"CY0200751713",qty:102.67477369,cur:"EUR",avg:32.16,sec:"Defence",geo:"Greece"},
{nm:"Adobe Inc",tk:"ADBE",isin:"US00724F1012",qty:15.5,cur:"USD",avg:216.84,sec:"Technology",geo:"USA"},
{nm:"Eldorado Gold Corp",tk:"EGO",isin:"CA2849025093",qty:135,cur:"USD",avg:31.84,sec:"Materials",geo:"Canada"},
{nm:"Kinsale Capital Group",tk:"KNSL",isin:"US49714P1084",qty:12.5,cur:"USD",avg:328.67,sec:"Financials",geo:"USA"},
{nm:"iShares S&P 500 Equal Weight",tk:"EWSP.L",isin:"IE000MLMNYS0",qty:509,cur:"GBP",avg:5.837,sec:"US Equity",geo:"USA"},
{nm:"AlzChem Group AG",tk:"ACT.DE",isin:"DE000A2YNT30",qty:20,cur:"EUR",avg:163.20,sec:"Materials",geo:"Germany"},
{nm:"Adyen NV",tk:"ADYEN.AS",isin:"NL0012969182",qty:4,cur:"EUR",avg:817.40,sec:"Technology",geo:"Netherlands"},
{nm:"Broadcom Inc",tk:"AVGO",isin:"US11135F1012",qty:12,cur:"USD",avg:377.82,sec:"Technology",geo:"USA"},
];

// Forward annual dividend YIELD (decimal) by ISIN. Income = yield x market value.
const YLD={"FR0000124141":.045,"IE00B4ND3602":0,"US88088L1035":.045,"US63253R2013":.05,"IE00B4NCWG09":0,"JE00B6RMDP68":.07,"GB00BFYYL325":.08,"IE00BSPLC298":0,"DK0062498333":.03,"GB0001320778":.04,"GB00BYT18307":.06,"US3695501086":.015,"CY0200751713":0,"US00724F1012":0,"CA2849025093":.01,"US49714P1084":.0025,"IE000MLMNYS0":0,"DE000A2YNT30":.01,"NL0012969182":0,"US11135F1012":.007};
// Snapshot prices from the 27 Aug 2026 Trading 212 confirmation of holdings.
const SNAP={"VIE.PA":32.58,"SGLN.L":6561,"TEZNY":33.84,"KAP.L":76.5,"SSLN.L":4809,"BIPS.L":171,"MGCI.L":91.8,"ZPRX.DE":71.35,"NOV.DE":39.39,"JAGI.L":584,"TBCG.L":5015,"GD":379.55,"THEON.AS":34,"ADBE":288.99,"EGO":48,"KNSL":381.8,"EWSP.L":5.943,"ACT.DE":164,"ADYEN.AS":1079.6,"AVGO":370.99};
const SC={"Utilities":"#63d2c3","Commodities":"#e5a54b","Energy":"#facc15","Fixed Income":"#8694aa","Sm-Cap Value":"#f472b6","Healthcare":"#34d399","Asia Equity":"#6fa3f7","Financials":"#60a5fa","Defence":"#fb7185","Technology":"#a78bfa","Materials":"#fb923c","US Equity":"#818cf8"};
const GC={"France":"#63d2c3","Germany":"#818cf8","Global":"#8694aa","Italy":"#34d399","Kazakhstan":"#e5a54b","UK/Global":"#6fa3f7","Europe":"#f472b6","Denmark":"#fb923c","Netherlands":"#e879f9","Greece":"#fbbf24","Asia-Pacific":"#facc15","Georgia":"#38bdf8","USA":"#a78bfa","Canada":"#f87171"};

// ═══════════════════════════════════════════════════════════════
// CASH, CONTRIBUTIONS & BENCHMARK
// ═══════════════════════════════════════════════════════════════
const SNAP_DATE = "2026-08-27";     // date of the Trading 212 holdings statement
const CASH      = 9000;             // cash held in the ISA, swept into MMFs
const MMF       = 0.038;            // current MMF rate, used for the benchmark cash sleeve

// Every subscription into the ISA. Add a line each time you pay money in.
const FLOWS = [
  {d:"2025-01-10", amt:20000},
  {d:"2025-07-10", amt:20000},
  {d:"2026-04-10", amt:20000},
];

// Benchmark: Vanguard LifeStrategy 60% Equity Fund, GBP Acc. 60/40 equities/bonds,
// sterling-denominated, ISA-eligible, 0.20% OCF.
// buyNav are RECONSTRUCTED from Vanguard's published trailing and calendar returns,
// not published daily NAVs. Replace with actuals from the Vanguard price download.
const BMK = {
  nm:"Vanguard LifeStrategy 60% Equity",
  short:"VGLS60A",
  isin:"GB00B3TYHH97",
  tk:"0P0000TKZK.L",          // Yahoo symbol for the A Acc share class, quoted in GBP
  navSnap:303.7381,           // NAV at 27 Aug 2026 (Vanguard)
  buyNav:{"2025-01-10":253.42, "2025-07-10":265.47, "2026-04-10":289.94},
  estimated:true
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
// FX calibrated so the snapshot total reconciles to the 27 Aug statement (£61,702.80).
let P={...SNAP},fx={EUR:.85778,USD:.73603,GBX:.01,GBP:1},lr=null,rfg=false,rmsg="",rerr="",vw="overview";
let bmkLive=false,bmkMode="full";   // "full" = benchmark fully invested (default), "cash" = benchmark holds a matching cash sleeve

// ═══════════════════════════════════════════════════════════════
// PRICE REFRESH via Cloudflare Worker
// ═══════════════════════════════════════════════════════════════
async function refreshPrices(){
  if(rfg)return;
  if(!WORKER_URL){rerr="Set your Cloudflare Worker URL above to enable live prices.";render();return;}
  rfg=true;rerr="";rmsg="Fetching live prices...";render();
  try{
    const tks=H.map(h=>h.tk).concat(BMK.tk?[BMK.tk]:[]).join(",");
    const url=`${WORKER_URL}?symbols=${encodeURIComponent(tks)}`;
    const resp=await Promise.race([
      fetch(url),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("timed out after 20s")),20000))
    ]);
    if(!resp.ok)throw new Error("Worker returned "+resp.status);
    const data=await resp.json();
    if(data.error)throw new Error(data.error);
    let ok=0,fail=0;
    H.forEach(h=>{
      const q=data[h.tk];
      if(q&&q.price>0){
        let p=q.price;
        if(h.cur==="GBX"){
          // stored in pence; Yahoo sometimes quotes this line in pounds
          if(q.currency==="GBP")p*=100;
          else if(q.currency!=="GBp"&&q.currency!=="GBX"){const s=SNAP[h.tk];if(s&&s>100&&p<s/20)p*=100;}
        }else if(h.cur==="GBP"){
          // stored in pounds; Yahoo sometimes quotes this line in pence
          if(q.currency==="GBp"||q.currency==="GBX")p/=100;
          else{const s=SNAP[h.tk];if(s&&p>s*20)p/=100;}
        }
        P[h.tk]=p;ok++;
      }else fail++;
    });
    if(BMK.tk){
      const b=data[BMK.tk];
      if(b&&b.price>0){
        let p=b.price;
        if(b.currency==="GBp"||b.currency==="GBX")p/=100;
        else if(p>BMK.navSnap*20)p/=100;          // Yahoo occasionally quotes this line in pence
        P[BMK.tk]=p;bmkLive=true;
      }
      else bmkLive=false;
    }
    if(data.__fx){
      if(data.__fx.EUR)fx.EUR=data.__fx.EUR;
      if(data.__fx.USD)fx.USD=data.__fx.USD;
    }
    lr=new Date().toISOString();
    if(fail>0)rerr=`${ok} updated, ${fail} using fallback prices.`;
  }catch(e){rerr="Refresh failed: "+e.message;}
  rfg=false;rmsg="";render();
}

// ═══════════════════════════════════════════════════════════════
// CALCULATIONS
// ═══════════════════════════════════════════════════════════════
function toG(v,cur){return cur==="GBP"?v:(cur==="GBX"||cur==="GBp")?v*.01:cur==="EUR"?v*fx.EUR:cur==="USD"?v*fx.USD:v;}
function calc(){
  const R=H.map(h=>{
    const cp=P[h.tk]||SNAP[h.tk]||0,mkt=toG(h.qty*cp,h.cur),cost=toG(h.qty*h.avg,h.cur);
    const capPnl=mkt-cost,capPct=cost>0?capPnl/cost*100:0,divs=mkt*(YLD[h.isin]||0);
    const totPnl=capPnl+divs,totPct=cost>0?totPnl/cost*100:0;
    return{...h,cp,mkt,cost,capPnl,capPct,divs,totPnl,totPct,wt:0};
  });
  const tv=R.reduce((s,r)=>s+r.mkt,0),tc=R.reduce((s,r)=>s+r.cost,0),td=R.reduce((s,r)=>s+r.divs,0);
  R.forEach(r=>r.wt=tv>0?r.mkt/tv*100:0);
  const tcp=tv-tc,tcpp=tc>0?tcp/tc*100:0,ttp=tcp+td,ttpp=tc>0?ttp/tc*100:0,dy=tv>0?td/tv*100:0;
  const sm={};R.forEach(r=>sm[r.sec]=(sm[r.sec]||0)+r.mkt);
  const secs=Object.entries(sm).map(([k,v])=>({l:k,v,pct:tv>0?v/tv*100:0,c:SC[k]||"#596b85"})).sort((a,b)=>b.v-a.v);
  const gm={};R.forEach(r=>gm[r.geo]=(gm[r.geo]||0)+r.mkt);
  const geos=Object.entries(gm).map(([k,v])=>({l:k,v,pct:tv>0?v/tv*100:0,c:GC[k]||"#596b85"})).sort((a,b)=>b.v-a.v);
  const cm={};R.forEach(r=>{const k=(r.cur==="GBX"||r.cur==="GBp")?"GBP":r.cur;cm[k]=(cm[k]||0)+r.mkt;});
  const curs=Object.entries(cm).map(([k,v])=>({l:k,v,pct:tv>0?v/tv*100:0,c:k==="GBP"?"#63d2c3":k==="EUR"?"#818cf8":"#e5a54b"})).sort((a,b)=>b.v-a.v);
  const srt=[...R].sort((a,b)=>b.mkt-a.mkt),t5=srt.slice(0,5).reduce((s,r)=>s+r.wt,0);
  const byR=[...R].sort((a,b)=>b.totPct-a.totPct);
  return{R,srt,tv,tc,td,tcp,tcpp,ttp,ttpp,dy,secs,geos,curs,t5,byR};
}

// ---- money-weighted return (XIRR) ----
const DAY=864e5;
function xirr(fl){
  const f=[...fl].sort((a,b)=>a.t-b.t),t0=f[0].t;
  const npv=r=>f.reduce((s,x)=>s+x.a/Math.pow(1+r,(x.t-t0)/(365*DAY)),0);
  let lo=-0.9999,hi=10;
  if(npv(lo)<0||npv(hi)>0)return null;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;npv(m)>0?lo=m:hi=m;}
  return (lo+hi)/2;
}
function valDate(){return lr?new Date(lr):new Date(SNAP_DATE+"T00:00:00Z");}
function bmkNav(){return (bmkLive&&P[BMK.tk]>0)?P[BMK.tk]:BMK.navSnap;}

function irrCalc(D){
  const vd=valDate(),nav=bmkNav();
  const paid=FLOWS.reduce((s,f)=>s+f.amt,0);
  const mine=D.tv+CASH;                                   // portfolio at market + cash
  const cashW=mine>0?CASH/mine:0;                         // your cash weight today
  const out=FLOWS.map(f=>({t:new Date(f.d+"T00:00:00Z"),a:-f.amt}));
  const myIrr=xirr([...out,{t:vd,a:mine}]);

  // benchmark, same money on the same days
  const legs=FLOWS.map(f=>{
    const bn=BMK.buyNav[f.d]||nav,w=bmkMode==="cash"?1-cashW:1;
    const yrs=(vd-new Date(f.d+"T00:00:00Z"))/(365*DAY);
    return{...f,bn,units:f.amt*w/bn,cash:f.amt*(1-w)*Math.pow(1+MMF,yrs),w};
  });
  const bUnits=legs.reduce((s,l)=>s+l.units,0),bCash=legs.reduce((s,l)=>s+l.cash,0);
  const bVal=bUnits*nav+bCash;
  const bIrr=xirr([...out,{t:vd,a:bVal}]);
  return{vd,nav,paid,mine,cashW,myIrr,bIrr,bVal,bUnits,bCash,legs,
         lead:(myIrr!=null&&bIrr!=null)?myIrr-bIrr:null,gain:mine-paid,bGain:bVal-paid,
         days:Math.round((vd-new Date(FLOWS[0].d+"T00:00:00Z"))/DAY)};
}

function pie(data,sz=185){

  const arc=(s,e)=>{if(e-s>=.9999)return"M 0 -1 A 1 1 0 1 1 -.0001 -1 A 1 1 0 1 1 0 -1";const sx=Math.sin(2*Math.PI*s),sy=-Math.cos(2*Math.PI*s),ex=Math.sin(2*Math.PI*e),ey=-Math.cos(2*Math.PI*e);return`M 0 0 L ${sx} ${sy} A 1 1 0 ${e-s>.5?1:0} 1 ${ex} ${ey} Z`;};

    <p style="font-size:12px;color:var(--t3);line-height:1.65">${esc(BMK.nm)} (${esc(BMK.short)}), 60% global equities and 40% global bonds, sterling-denominated and ISA-eligible at 0.20% OCF. ${bmkMode==="full"
      ?`The benchmark is <b style="color:var(--t2)">fully invested</b>: all ${F(I.paid)} goes into the fund. Holding ${cw.toFixed(1)}% in cash is your own allocation decision, so its cost or benefit stays inside your number rather than being neutralised on both sides.`
      :`The benchmark parks <b style="color:var(--t2)">${cw.toFixed(1)}% at ${(MMF*100).toFixed(1)}%</b> to mirror your cash weight. Shown for reference only; the fully invested version is the live comparison.`}</p></div>`;

  o+=`<div class="g2"><div class="cd"><div class="ch"><span class="ct">Where your money sits</span><span class="cb">${F(tot)}</span></div>
    <div class="seg"><div style="width:${iw}%;background:var(--ac)">${iw.toFixed(0)}%</div><div style="width:${cw}%;background:var(--am)">${cw.toFixed(0)}%</div></div>
    <div class="pr"><div class="psw" style="background:var(--ac)"></div><span class="pn">Invested</span><span class="pp">${iw.toFixed(1)}%</span><span class="pv">${F(inv)}</span></div>
    <div class="pr"><div class="psw" style="background:var(--am)"></div><span class="pn">Cash in MMFs</span><span class="pp">${cw.toFixed(1)}%</span><span class="pv">${F(cs)}</span></div>
    <div class="mr" style="margin-top:10px"><span class="mr-l">Cash earning</span><span class="mr-v" style="color:var(--am)">${(MMF*100).toFixed(2)}%</span></div>
    <div class="mr"><span class="mr-l">Annualised on cash</span><span class="mr-v" style="color:var(--am)">${F(cs*MMF)}</span></div></div>`;

  o+=`<div class="cd"><div class="ch"><span class="ct">Growth of ${F(I.paid)}</span></div>`;
  const mx=Math.max(I.mine,I.bVal,I.paid);
  [["Contributed",I.paid,"rgba(134,148,170,.3)","var(--t3)"],["Benchmark",I.bVal,"rgba(229,165,75,.32)","var(--am)"],["Your portfolio",I.mine,"rgba(99,210,195,.32)","var(--ac)"]].forEach(([l,v,bg,c])=>{
    o+=`<div class="br"><div class="bl">${l}</div><div class="bt"><div class="bf" style="width:${v/mx*100}%;background:${bg}"></div></div><div class="bv" style="color:${c}">${F(v)}</div></div>`;});
  o+=`<div class="mr" style="margin-top:12px"><span class="mr-l">Your gain</span><span class="mr-v" style="color:${cl(I.gain)}">${F(I.gain)}</span></div>
    <div class="mr"><span class="mr-l">Benchmark gain</span><span class="mr-v" style="color:var(--am)">${F(I.bGain)}</span></div>
    <div class="mr"><span class="mr-l">Difference</span><span class="mr-v" style="color:${cl(I.gain-I.bGain)}">${F(I.gain-I.bGain)}</span></div></div></div>`;

  o+=`<div class="cd gf"><div class="ch"><span class="ct">Cash flows</span><span class="cb">${FLOWS.length} subscriptions</span></div><div class="tw"><table><thead><tr>`;
  ["Date","Paid in","Days held","Bmk NAV","To fund","To cash","Units"].forEach(x=>o+=`<th>${x}</th>`);
  o+=`</tr></thead><tbody>`;
  I.legs.forEach(l=>{
    const dh=Math.round((I.vd-new Date(l.d+"T00:00:00Z"))/DAY);
    o+=`<tr><td style="color:var(--t2);font-weight:500">${dstr(l.d)}</td>
      <td style="font-family:var(--mono);font-size:10.5px">${F(l.amt)}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:var(--t3)">${dh}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:var(--t3)">£${l.bn.toFixed(2)}${BMK.estimated?'<span style="color:var(--am)">*</span>':''}</td>
      <td style="font-family:var(--mono);font-size:10.5px">${F(l.amt*l.w)}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:${l.amt*(1-l.w)>0?"var(--am)":"var(--t5)"}">${l.amt*(1-l.w)>0?F(l.amt*(1-l.w)):"—"}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:var(--t3)">${l.units.toFixed(3)}</td></tr>`;});
  o+=`</tbody><tfoot><tr><td style="color:var(--t3);font-size:11px">TOTAL</td>
    <td style="font-family:var(--mono);font-size:11.5px">${F(I.paid)}</td><td></td><td></td>
    <td style="font-family:var(--mono);font-size:11.5px">${F(I.legs.reduce((s,l)=>s+l.amt*l.w,0))}</td>
    <td style="font-family:var(--mono);font-size:11.5px;color:var(--am)">${I.bCash>0?F(I.legs.reduce((s,l)=>s+l.amt*(1-l.w),0)):"—"}</td>
    <td style="font-family:var(--mono);font-size:11.5px;color:var(--t3)">${I.bUnits.toFixed(3)}</td></tr></tfoot></table></div>`;

  o+=`<p class="note">IRR is money-weighted, so both sides are measured on the same three payment dates and neither is flattered by when the money went in. The benchmark buys ${esc(BMK.short)} on each of those dates${bmkMode==="cash"?` and parks the matching cash slice at ${(MMF*100).toFixed(1)}%`:``}, then holds.
  ${BMK.estimated?`<br><span style="color:var(--am)">* The three purchase NAVs are reconstructed from Vanguard's published trailing and calendar-year returns rather than daily NAVs, so each could be out by a percent or two. Replace <code style="color:var(--ac)">BMK.buyNav</code> with actuals from Vanguard's price download to firm this up.</span>`:``}
  <br>${bmkLive
    ?`NAV is live from <code style="color:var(--ac)">${esc(BMK.tk)}</code>. As an unlisted OEIC the fund prices once daily at its valuation point, so this NAV can be a session behind your holdings.`
    :`NAV held at the ${dstr(SNAP_DATE)} close of £${BMK.navSnap.toFixed(4)}. Hit refresh to pull the live NAV from <code style="color:var(--ac)">${esc(BMK.tk)}</code>.`}
  <br>The benchmark is 60/40 equities and bonds with no commodities, so your gold and silver sit outside it entirely. Your equity weight also runs above the fund's, which accounts for part of any lead.</p></div>`;
  return o;
}

render();
</script>
</body>
</html>
